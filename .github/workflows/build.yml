


name: Build AutoAnchor

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Find and extract ZIP
        run: |
          ZIP_FILE="$(find . -type f -iname '*AutoAnchor*.zip' -print -quit)"
          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No AutoAnchor ZIP found in repository"
            find . -maxdepth 3 -type f
            exit 1
          fi
          echo "Found ZIP: $ZIP_FILE"
          mkdir project
          unzip -o "$ZIP_FILE" -d project
          find project -name build.gradle -print

      - name: Build mod
        run: |
          BUILD_FILE="$(find project -name build.gradle -print -quit)"
          if [ -z "$BUILD_FILE" ]; then
            echo "ERROR: build.gradle was not found inside the ZIP"
            exit 1
          fi
          cd "$(dirname "$BUILD_FILE")"
          gradle build --no-daemon

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: AutoAnchor-JAR
          path: project/**/build/libs/*.jar
          if-no-files-found: error

